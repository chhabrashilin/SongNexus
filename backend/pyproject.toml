[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "songnexus"
version = "0.1.0"
description = "Music knowledge graph and grounded discovery platform (UW-Madison CS 620 x Google capstone)."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The LLM layer is optional: without it the agent runs its deterministic planner.
llm = ["anthropic>=1.0"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "networkx>=3.3",   # test oracle for our own graph algorithm implementations
    "numpy>=2.0",      # required by the networkx PageRank oracle
    "scipy>=1.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
songnexus = "songnexus.cli:main"

[tool.setuptools.packages.find]
include = ["songnexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL (set SONGNEXUS_TEST_DATABASE_URL)",
    "network: calls external APIs (never run in CI)",
    "sample_data: uses the committed MusicBrainz sample snapshot",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in argument defaults is idiomatic
    "RUF001",  # music metadata legitimately contains typographic characters (‐ ’ “ ”)
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "anthropic.*"]
ignore_missing_imports = true
