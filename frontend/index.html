<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SongNexus: explore how artists are connected, with every connection backed by source data." />
    <meta name="theme-color" content="#0f1012" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23201d38'/%3E%3Cpath d='M10 20.5 21.5 11' stroke='%239085e9' stroke-width='2.2'/%3E%3Ccircle cx='10' cy='20.5' r='4' fill='%239085e9'/%3E%3Ccircle cx='21.5' cy='11' r='3.2' fill='%23f4f4f2'/%3E%3C/svg%3E" />
    <title>SongNexus</title>
    <script>
      // Apply the saved theme before first paint (storage can be unavailable; default is dark).
      try {
        if (localStorage.getItem("songnexus.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
