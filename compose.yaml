# Local PostgreSQL for development (production uses Cloud SQL).
#   docker compose up -d        then set SONGNEXUS_DATABASE_URL as in server/.env.example
# Bound to 127.0.0.1:15432 so it never collides with another local PostgreSQL on 5432.
name: songnexus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: songnexus
      POSTGRES_PASSWORD: songnexus
      POSTGRES_DB: songnexus
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - songnexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songnexus"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional shared response cache. Off by default; start with `docker compose --profile cache up -d`
  # and set SONGNEXUS_REDIS_URL=redis://127.0.0.1:16379/0. The API works without it (in-process cache).
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  songnexus-postgres:
