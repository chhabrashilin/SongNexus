name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songnexus
          POSTGRES_PASSWORD: songnexus
          POSTGRES_DB: songnexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U songnexus"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,llm]"
      - name: Format
        run: ruff format --check songnexus tests
      - name: Lint
        run: ruff check songnexus tests
      - name: Typecheck
        run: mypy songnexus
      - name: Tests (unit, integration, PostgreSQL, sample-data regression)
        env:
          SONGNEXUS_TEST_DATABASE_URL: postgresql+psycopg://songnexus:songnexus@localhost:5432/songnexus_test
        run: pytest
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: docker compose build
