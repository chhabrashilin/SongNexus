name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songnexus
          POSTGRES_PASSWORD: songnexus
          POSTGRES_DB: songnexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U songnexus"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src tests
      - name: Layering
        run: uv run lint-imports
      - name: Tests (SQLite + PostgreSQL + golden data)
        env:
          SONGNEXUS_TEST_DATABASE_URL: postgresql+psycopg://songnexus:songnexus@localhost:5432/songnexus_test
        run: uv run pytest --cov --cov-report=term
      - name: OpenAPI contract is up to date
        run: uv run songnexus openapi --check
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --format requirements-txt --no-hashes --no-dev)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget (initial JS ≤ 200 KB gzip)
        run: node scripts/check-bundle-size.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the catalog and start the API
        working-directory: server
        env:
          SONGNEXUS_DATABASE_URL: sqlite:////tmp/e2e.db
          SONGNEXUS_ALLOWED_ORIGINS: '["http://127.0.0.1:4273"]'
        run: |
          uv sync --locked --no-dev
          uv run songnexus ingest > /dev/null
          uv run uvicorn songnexus.service.app:create_app --factory --port 8790 --no-access-log &
      - name: Build and serve the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx vite preview --host 127.0.0.1 --port 4273 --strictPort &
          npx --yes wait-on@8 http://127.0.0.1:8790/healthz http://127.0.0.1:4273
      - name: Journeys and accessibility (mobile + desktop)
        working-directory: web
        run: npx playwright test
