# One-command local stack:  docker compose up --build
#   frontend  http://localhost:8080   (nginx serving the built app, proxying /api)
#   backend   http://localhost:8000/docs
# Host ports are configurable if 8000/8080 are taken: SONGNEXUS_API_PORT, SONGNEXUS_WEB_PORT.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: songnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-songnexus-local-only}
      POSTGRES_DB: songnexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songnexus -d songnexus"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SONGNEXUS_DATABASE_URL: postgresql+psycopg://songnexus:${POSTGRES_PASSWORD:-songnexus-local-only}@db:5432/songnexus
      SONGNEXUS_CORS_ORIGINS: '["http://localhost:8080"]'
      SONGNEXUS_ADMIN_TOKEN: ${SONGNEXUS_ADMIN_TOKEN:-}
      # Optional: enables LLM mode for the agent. Without it the deterministic planner answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SONGNEXUS_API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SONGNEXUS_WEB_PORT:-8080}:80"

volumes:
  pgdata:
